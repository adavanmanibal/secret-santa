<body>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<div id="app"></div>

<script>
/* ============================================================
   API — Supabase en direct (REST/RPC), ou faux serveur en mode démo
   ============================================================ */
const DEMO = !SUPABASE_URL || !SUPABASE_KEY;
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function rpc(fn, args = {}) {
  if (DEMO) { await sleep(180); return demo[fn](args); }
  const r = await fetch(`${SUPABASE_URL.replace(/\/$/, "")}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

const ERR = {
  pin: "Mauvais code. Le Père Noël te regarde. 👀",
  locked: "Trop d'essais ! Code bloqué 10 minutes. Va prendre un café. ☕",
  already: "Ce prénom a déjà un code. Si ce n'est pas toi, préviens Adavan.",
  format: "Il faut exactement 4 chiffres.",
  nopin: "Pas encore de code pour ce prénom.",
  unknown: "Prénom introuvable (retiré de la liste ?).",
  notdrawn: "Le tirage n'a pas encore été lancé.",
  admin: "Mot de passe admin incorrect.",
  exists: "Ce prénom est déjà dans la liste.",
  few: "Il faut au moins 3 participants.",
  drawn: "Le tirage est déjà fait."
};
const errText = e => ERR[e] || "Oups, souci de connexion. Réessaie.";

/* ---------- faux serveur (mode démo) ---------- */
const demo = (() => {
  const P = ["Adavan","Sarah","Romain","Alix","Florian","Victoire","Marie","Tristan","Christophe LG","Christophe D","Clément","Gaëlle","Audrey","Laurence","Charlène","Luisa"]
    .map(name => ({ name, pin: null, wishlist: "", giftee: null, opened: false, changed: false }));
  const WISH = ["J'adore le chocolat noir, les plantes increvables et les chaussettes moches.", "Tout sauf une bougie. J'ai 14 bougies.", ""];
  const draw = () => { const s = [...P].sort(() => Math.random() - .5); s.forEach((p, i) => { p.giftee = s[(i + 1) % s.length].name; p.opened = false; p.changed = false; }); };
  P.forEach((p, i) => p.wishlist = WISH[i % 3]); draw();
  const find = n => P.find(p => p.name === n);
  const auth = (n, pin) => { const p = find(n); return !p ? { e: "unknown" } : !p.pin ? { e: "nopin" } : p.pin !== pin ? { e: "pin" } : { p }; };
  const gift = p => { const g = find(p.giftee); return g ? { name: g.name, wishlist: g.wishlist } : null; };
  const pub = adm => P.map(p => ({ name: p.name, claimed: !!p.pin, opened: p.opened, ...(adm ? { wish: !!p.wishlist } : {}) })).sort((a, b) => a.name.localeCompare(b.name));
  const drawn = () => P.some(p => p.giftee);
  const adm = (pass, f) => pass === "demo" ? f() : { ok: false, error: "admin" };
  return {
    ss_list: () => ({ drawn: drawn(), people: pub() }),
    ss_register: ({ p_name, p_pin }) => { const p = find(p_name); if (!/^\d{4}$/.test(p_pin)) return { ok: false, error: "format" }; if (p.pin) return { ok: false, error: "already" }; p.pin = p_pin; return { ok: true }; },
    ss_me: ({ p_name, p_pin }) => { const { p, e } = auth(p_name, p_pin); return e ? { ok: false, error: e } : { ok: true, drawn: !!p.giftee, opened: p.opened, changed: p.changed, wishlist: p.wishlist, giftee: p.opened ? gift(p) : null }; },
    ss_wish: ({ p_name, p_pin, p_text }) => { const { p, e } = auth(p_name, p_pin); if (e) return { ok: false, error: e }; p.wishlist = p_text.slice(0, 400); return { ok: true }; },
    ss_open: ({ p_name, p_pin }) => { const { p, e } = auth(p_name, p_pin); if (e) return { ok: false, error: e }; if (!p.giftee) return { ok: false, error: "notdrawn" }; p.opened = true; p.changed = false; return { ok: true, giftee: gift(p) }; },
    ss_admin_state: ({ p_pass }) => adm(p_pass, () => ({ ok: true, drawn: drawn(), people: pub(true) })),
    ss_admin_add: ({ p_pass, p_name }) => adm(p_pass, () => { const n = p_name.trim(); if (!n) return { ok: false, error: "format" }; if (P.some(p => p.name.toLowerCase() === n.toLowerCase())) return { ok: false, error: "exists" };
      const np = { name: n, pin: null, wishlist: "", giftee: null, opened: false, changed: false };
      if (drawn()) { const a = P.find(p => !p.opened) || P[0]; np.giftee = a.giftee; a.giftee = n; a.changed = a.opened; a.opened = false; } P.push(np); return { ok: true }; }),
    ss_admin_remove: ({ p_pass, p_name }) => adm(p_pass, () => { const x = find(p_name); if (x.giftee) { if (P.length <= 3) return { ok: false, error: "few" }; const a = P.find(p => p.giftee === x.name); a.giftee = x.giftee; a.changed = a.opened; a.opened = false; } P.splice(P.indexOf(x), 1); return { ok: true }; }),
    ss_admin_reset_pin: ({ p_pass, p_name }) => adm(p_pass, () => { find(p_name).pin = null; return { ok: true }; }),
    ss_admin_draw: ({ p_pass, p_force }) => adm(p_pass, () => { if (drawn() && !p_force) return { ok: false, error: "drawn" }; draw(); return { ok: true }; })
  };
})();

/* ============================================================
   Petits effets : neige, confettis, sons
   ============================================================ */
const FX = (() => {
  const c = $("#fx"), x = c.getContext("2d"); let W, H, D = Math.min(2, devicePixelRatio || 1);
  const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const size = () => { W = innerWidth; H = innerHeight; c.width = W * D; c.height = H * D; x.setTransform(D, 0, 0, D, 0, 0); };
  size(); addEventListener("resize", size);
  const snow = Array.from({ length: calm ? 0 : 70 }, () => ({ x: Math.random() * 2000, y: Math.random() * 1200, r: 1 + Math.random() * 2.6, v: .3 + Math.random() * .9, w: Math.random() * 6.28 }));
  let conf = [];
  const COL = ["#e5383b", "#ffd166", "#2ec4a0", "#fff7e6", "#6db8ff", "#ff6ad5"];
  function burst(n = 180) {
    if (calm) return;
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 4 + Math.random() * 13;
      conf.push({ x: W / 2, y: H * .42, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, r: 4 + Math.random() * 6, c: COL[i % COL.length], rot: Math.random() * 6.28, vr: (Math.random() - .5) * .5, life: 1 }); }
  }
  (function tick() {
    x.clearRect(0, 0, W, H);
    x.fillStyle = "rgba(255,255,255,.75)";
    for (const s of snow) { s.y += s.v; s.w += .02; s.x += Math.sin(s.w) * .4; if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; } x.beginPath(); x.arc(s.x % W, s.y, s.r, 0, 6.28); x.fill(); }
    for (const p of conf) { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .006;
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot); x.globalAlpha = Math.max(0, p.life); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); x.restore(); }
    conf = conf.filter(p => p.life > 0 && p.y < H + 40);
    requestAnimationFrame(tick);
  })();
  return { burst };
})();

const SND = (() => {
  let ac, on = true;
  const ctx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
  const tone = (f, t, d = .5, type = "triangle", v = .14) => { const a = ctx(), o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t + d); o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + d); };
  const wrap = f => (...a) => { if (!on) return; try { f(...a); } catch (e) {} };
  return {
    toggle: () => (on = !on), get on() { return on; },
    tap: wrap(() => tone(180, 0, .12, "square", .06)),
    rip: wrap(() => { const a = ctx(), n = a.sampleRate * .4, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = "bandpass"; f.frequency.setValueAtTime(900, a.currentTime); f.frequency.exponentialRampToValueAtTime(5000, a.currentTime + .35); g.gain.value = .35; s.connect(f).connect(g).connect(a.destination); s.start(); }),
    drum: wrap(() => { for (let i = 0; i < 16; i++) tone(90 + (i % 2) * 20, i * .09, .08, "square", .05); }),
    fail: wrap(() => { tone(330, 0, .25, "sawtooth", .08); tone(247, .22, .5, "sawtooth", .08); }),
    win: wrap(() => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .08, .7)); tone(2093, .5, 1.2, "sine", .08); })
  };
})();

const S = { list: null, name: null, pin: null, my: null, admin: null };
const store = { get() { try { return JSON.parse(sessionStorage.getItem("ss") || "null"); } catch (e) { return null; } },
                set(v) { try { v ? sessionStorage.setItem("ss", JSON.stringify(v)) : sessionStorage.removeItem("ss"); } catch (e) {} } };
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const initials = n => n.split(/\s+/).map((w, i) => i ? w : w[0]).join("").slice(0, 3).toUpperCase();
const hue = n => hash(n) % 360;
const daysLeft = () => Math.ceil((new Date(EVENT.date + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
const countdown = () => { const d = daysLeft(); return d > 1 ? `J-${d}` : d === 1 ? "C'est demain !" : d === 0 ? "C'est aujourd'hui ! 🎉" : "C'est passé… 😅"; };

function topbar(back) {
  return `<div class="top">

    <button class="ghost" id="snd" aria-label="Son">${SND.on ? "🔊" : "🔇"}</button></div>`;
}
function bindTop() {
  $("#snd").onclick = e => { e.target.textContent = SND.toggle() ? "🔊" : "🔇"; };
  const b = $("#back"); if (b) b.onclick = () => { S.name = S.pin = S.my = null; store.set(null); home(); };
}

function askPin(p) {
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<form class="modal" autocomplete="off">
    <h2>${p.claimed ? `Re-bonjour ${esc(p.name)}` : `Bienvenue ${esc(p.name)} !`}</h2>
    <p>${p.claimed ? "Ton code secret à 4 chiffres&nbsp;?" : "Choisis un code secret à 4 chiffres. Il te servira à revenir voir ta carte — retiens-le&nbsp;!"}</p>
    <input class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" type="password" aria-label="Code à 4 chiffres" placeholder="••••">
    <div class="msg"></div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button type="button" class="btn small" id="cancel">Annuler</button>
      <button class="btn">${p.claimed ? "Entrer" : "Créer mon code"}</button></div></form>`;
  document.body.append(v);
  const inp = $(".pin", v), msg = $(".msg", v); inp.focus();
  $("#cancel", v).onclick = () => v.remove();
  v.onclick = e => { if (e.target === v) v.remove(); };
  $("form", v).onsubmit = async e => {
    e.preventDefault(); const pin = inp.value.trim();
    const fail = t => { msg.textContent = t; $(".modal", v).classList.remove("shake"); void v.offsetWidth; $(".modal", v).classList.add("shake"); inp.value = ""; inp.focus(); };
    if (!/^\d{4}$/.test(pin)) return fail(ERR.format);
    try {
      if (!p.claimed) { const r = await rpc("ss_register", { p_name: p.name, p_pin: pin }); if (!r.ok) return fail(errText(r.error)); }
      const me = await rpc("ss_me", { p_name: p.name, p_pin: pin });
      if (!me.ok) return fail(errText(me.error));
      S.name = p.name; S.pin = pin; S.my = me; store.set({ n: p.name, p: pin }); v.remove(); mine();
    } catch (err) { fail(errText()); }
  };
}

/* ============================================================
   MON ESPACE : booster / carte / indices
   ============================================================ */
const JOKES = [
  { big: "TOI", nm: "Toi-même", sub: "Bug du traîneau détecté…", stats: [["Budget", "10 € pour toi, bravo"], ["Effet de surprise", "0 %"]] },
  { big: "PDG", nm: "Le grand patron", sub: "Bonne chance avec 10 €", stats: [["Pression", "maximale"], ["Idée cadeau", "une augmentation ?"]] },
  { big: "🎅", nm: "Le vrai Père Noël", sub: "Il a déjà tout", stats: [["Adresse", "Pôle Nord"], ["Frais de port", "49,90 €"]] }
];
const RAR = ["Légendaire", "Ultra rare", "Holo brillante", "Édition limitée", "Collector"];
function funStats(name) {
  const h = hash(name), pick = (a, s) => a[(h >> s) % a.length];
  const all = [
    ["Sagesse en 2026", pick(["discutable", "suspecte", "exemplaire (auto-déclarée)", "en cours d'audit"], 2)],
    ["Amour du chocolat", `${70 + (h >> 4) % 30}/100`],
    ["Risque de deviner que c'est toi", `${3 + (h >> 6) % 30} %`],
    ["Exigence cadeau", "★".repeat(1 + (h >> 8) % 5) + "☆".repeat(4 - (h >> 8) % 5)],
    ["Pulls de Noël possédés", `${(h >> 10) % 6}`],
    ["Cafés par jour", pick(["2", "4", "trop", "on ne compte plus"], 12)],
    ["Talent pour emballer", pick(["papier journal", "scotch ×12", "niveau pro", "sac kraft et prière"], 14)]
  ];
  const i = h % all.length; return [all[i], all[(i + 2) % all.length], all[(i + 4) % all.length]];
}
function frontHTML({ big, nm, sub, stats, rar, num, col, joke }) {
  return `<div class="rar"><span>${esc(rar)}</span><em>${esc(num)}</em></div>
    <div class="art" style="background:${col}"><span class="hat">🎅</span><span class="big">${esc(big)}</span></div>
    <div class="to">${esc(sub)}</div><div class="nm">${esc(nm)}</div>
    <ul class="stats">${stats.map(([k, v]) => `<li><span>${esc(k)}</span><b>${esc(v)}</b></li>`).join("")}</ul>`;
}
function realFront(g) {
  const n = (S.list?.people.length) || 16, i = (S.list?.people.findIndex(p => p.name === g.name) ?? 0) + 1;
  return frontHTML({ big: initials(g.name), nm: g.name, sub: "Tu offres un cadeau à", stats: funStats(g.name), rar: RAR[hash(g.name) % RAR.length],
    num: `${String(i).padStart(2, "0")}/${n}`, col: `linear-gradient(140deg,hsl(${hue(g.name)} 85% 62%),hsl(${(hue(g.name) + 60) % 360} 85% 50%))` });
}
function jokeFront() { const j = JOKES[Math.floor(Math.random() * JOKES.length)];
  return frontHTML({ ...j, sub: j.sub, rar: "Mythique ???", num: "00/00", col: "#1b1030" }); }

function giftWish(g) {
  return `<div class="panel"><h3>🕵️ Les indices de ${esc(g.name)}</h3>
    <p style="color:var(--ink);font-size:16px;white-space:pre-wrap;margin:0">${g.wishlist ? esc(g.wishlist) : `Aucun indice pour l'instant. Reviens plus tard… ou improvise. 😈`}</p>
    <p style="margin:12px 0 0">Rappel&nbsp;: <b>${esc(EVENT.budget)} max</b>, remise des cadeaux <b>${esc(EVENT.dateLabel)}</b>.</p></div>`;
}

async function mine() {
  const app = $("#app"), me = S.my;
  const scene = me.drawn ? `<div class="scene">
      <div class="stage" id="stage">
        <div class="card ${me.opened ? "up" : ""}" id="card"><div class="inner">
          <div class="face back"><b>?</b><i>Secret Santa ${esc(EVENT.team)}</i></div>
          <div class="face front" id="front">${me.opened && me.giftee ? realFront(me.giftee) : ""}</div></div></div>
        ${me.opened ? "" : `<div class="pack" id="pack"><div class="strip"></div><div class="body">
          <div class="band">Booster · 1 collègue à l'intérieur</div><div class="q">?</div>
          <div class="t">SECRET SANTA</div><div class="m">${esc(EVENT.team)} · Noël ${EVENT.date.slice(0, 4)} · ne pas secouer</div></div></div>`}
      </div>
      <div class="caption" id="cap">${me.opened
        ? `Ta carte est face cachée.<small>Vérifie que personne ne regarde par-dessus ton épaule 👀 puis touche-la.</small>`
        : `Déchire le haut du booster&nbsp;!<small>Glisse ton doigt dessus… ou tape 3 fois comme une brute.</small>`}</div>
    </div>`
    : `<div class="panel" style="text-align:center;padding:34px 18px"><div style="font-size:64px">🧝‍♂️🎲</div>
        <h3>Les lutins n'ont pas encore mélangé les boosters</h3>
        <p>Ton code est créé, c'est parfait. Reviens dès que le tirage est annoncé. En attendant, laisse tes indices ci-dessous.</p></div>`;
  app.innerHTML = `${topbar(true)}
    <h2>Salut ${esc(S.name)} 👋</h2>
    ${me.changed ? `<div class="twist">🌀 <b>Rebondissement&nbsp;!</b> La liste a bougé et ton tirage a changé. Un nouveau booster t'attend.</div>` : ""}
    ${scene}
    <div id="gw">${me.opened && me.giftee ? `<div class="hide" id="gwin">${giftWish(me.giftee)}</div>` : ""}</div>
    <div class="panel"><h3>🎁 Tes indices pour ton Père Noël secret</h3>
      <p>Tes goûts, 2-3 idées, ce que tu ne veux surtout pas… Seule la personne qui t'a tiré·e les verra.</p>
      <textarea id="wish" rows="3" maxlength="400" placeholder="Ex. : fan de thé, de puzzles et de blagues nulles. Pas de bougie, pitié.">${esc(me.wishlist)}</textarea>
      <div class="row" style="margin-top:12px"><button class="btn gold" id="save">Enregistrer</button><span class="msg" id="wmsg" style="margin:0"></span></div></div>`;
  bindTop();
  $("#save").onclick = async () => {
    const r = await rpc("ss_wish", { p_name: S.name, p_pin: S.pin, p_text: $("#wish").value }).catch(() => ({}));
    $("#wmsg").textContent = r.ok ? "C'est noté ✅" : errText(r.error);
  };
  if (!me.drawn) return;
  const stage = $("#stage"), card = $("#card");
  stage.addEventListener("pointermove", e => { const r = stage.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    card.style.setProperty("--ry", (px - .5) * 22 + "deg"); card.style.setProperty("--rx", (.5 - py) * 18 + "deg");
    card.style.setProperty("--mx", px * 100 + "%"); card.style.setProperty("--my", py * 100 + "%"); });
  stage.addEventListener("pointerleave", () => { card.style.setProperty("--ry", "0deg"); card.style.setProperty("--rx", "0deg"); });
  if (me.opened) {
    let shown = false;
    card.onclick = () => { shown = !shown; card.style.setProperty("--flip", shown ? "180deg" : "0deg"); $("#gwin")?.classList.toggle("hide", !shown);
      $("#cap").innerHTML = shown ? `Chut. 🤫<small>Touche la carte pour la re-cacher.</small>` : `Carte cachée.<small>Touche-la pour la revoir.</small>`; if (shown) SND.tap(); };
  } else armPack();
}

function armPack() {
  const pack = $("#pack"), strip = $(".strip", pack); let sx = null, taps = 0, done = false, moved = 0;
  const setP = p => strip.style.setProperty("--p", p);
  const go = () => { if (done) return; done = true; openBooster(); };
  pack.addEventListener("pointerdown", e => { sx = e.clientX; moved = 0; try { pack.setPointerCapture(e.pointerId); } catch (_) {} });
  pack.addEventListener("pointermove", e => { if (sx == null || done) return; moved = Math.abs(e.clientX - sx); const p = Math.min(1, moved / (pack.offsetWidth * .75)); setP(Math.max(p, taps / 3)); if (p >= 1) go(); });
  const up = () => { if (sx == null || done) return; sx = null;
    if (moved < 8) { taps++; SND.tap(); pack.classList.remove("tap"); void pack.offsetWidth; pack.classList.add("tap"); if (taps >= 3) return go(); }
    setP(taps / 3); };
  pack.addEventListener("pointerup", up); pack.addEventListener("pointercancel", up);
}

async function openBooster() {
  const pack = $("#pack"), card = $("#card"), cap = $("#cap"), front = $("#front");
  const say = (t, s = "") => cap.innerHTML = `${t}${s ? `<small>${s}</small>` : ""}`;
  const flip = on => card.style.setProperty("--flip", on ? "180deg" : "0deg");
  SND.rip(); pack.classList.add("open");
  const req = rpc("ss_open", { p_name: S.name, p_pin: S.pin }).catch(() => ({ ok: false }));
  await sleep(500);
  pack.classList.add("gone"); card.classList.add("up");
  const res = await req;
  if (!res.ok) { say("Aïe, le traîneau a calé.", errText(res.error)); await sleep(2500); S.my = await rpc("ss_me", { p_name: S.name, p_pin: S.pin }); return mine(); }
  SND.drum(); card.classList.add("tremble");
  for (const l of ["Consultation des lutins…", "Tentative de corruption du Père Noël…", "Vérification que ce n'est pas toi…"]) { say(l); await sleep(850); }
  card.classList.remove("tremble");
  // la fausse joie
  front.classList.add("joke"); front.innerHTML = jokeFront(); say("Et tu as tiré…"); flip(true); await sleep(650); SND.fail();
  say("…ah.", "Attends, attends."); await sleep(1900);
  flip(false); say("Mais non, on rigole. 😅"); await sleep(900);
  // la vraie
  front.classList.remove("joke"); front.innerHTML = realFront(res.giftee);
  card.classList.add("tremble"); say("Pour de vrai cette fois…"); await sleep(900); card.classList.remove("tremble");
  flip(true); $("#flash").classList.remove("on"); void $("#flash").offsetWidth; $("#flash").classList.add("on");
  SND.win(); FX.burst(220); setTimeout(() => FX.burst(120), 450);
  say(`C'est ${esc(res.giftee.name)} ! 🎉`, "Chut. Tu ne dis rien à personne. 🤫");
  pack.remove();
  $("#gw").innerHTML = giftWish(res.giftee);
  S.my = { ...S.my, opened: true, changed: false, giftee: res.giftee };
  let shown = true;
  card.onclick = () => { shown = !shown; flip(shown); $("#gw").firstElementChild?.classList.toggle("hide", !shown); say(shown ? "Chut. 🤫" : "Carte cachée.", shown ? "Touche la carte pour la cacher." : "Touche-la pour la revoir."); };
}

async function admin(msg = "") {
  const app = $("#app");
  if (!S.admin) {
    app.innerHTML = `<div class="top"><a class="ghost" href="#" style="text-decoration:none">← Retour</a></div>
      <form class="panel" id="af"><h3>Coulisses du Père Noël</h3><p>Mot de passe admin${DEMO ? " (en démo : <b>demo</b>)" : ""}</p>
      <div class="row"><input type="password" id="ap" style="flex:1"><button class="btn">Entrer</button></div><div class="msg">${esc(msg)}</div></form>`;
    $("#af").onsubmit = async e => { e.preventDefault(); const pass = $("#ap").value;
      const r = await rpc("ss_admin_state", { p_pass: pass }).catch(() => ({})); if (r.ok) { S.admin = pass; admin(); } else admin(errText(r.error)); };
    return;
  }
  const st = await rpc("ss_admin_state", { p_pass: S.admin });
  if (!st.ok) { S.admin = null; return admin(errText(st.error)); }
  const P = st.people, cl = P.filter(p => p.claimed).length, op = P.filter(p => p.opened).length;
  app.innerHTML = `<div class="top"><a class="ghost" href="#" style="text-decoration:none">← Retour au site</a></div>
    <h2>Coulisses 🎅</h2>
    <div class="chips"><div class="chip">Participants <b>${P.length}</b></div><div class="chip">Codes créés <b>${cl}/${P.length}</b></div>
      <div class="chip">Tirage <b>${st.drawn ? "✅ fait" : "⏳ pas encore"}</b></div><div class="chip">Boosters ouverts <b>${op}/${P.length}</b></div></div>
    <div class="panel"><h3>🎲 Tirage au sort</h3>
      <p>${st.drawn ? "Le tirage est fait. Personne (même toi) ne voit qui a tiré qui. Tu peux encore ajouter ou retirer quelqu'un : la chaîne se répare toute seule et seule la personne concernée devra rouvrir un booster."
        : "Conseil : attends que tout le monde ait créé son code avant de lancer, comme ça personne ne peut ouvrir le booster d'un autre."}</p>
      <button class="btn ${st.drawn ? "small" : "gold"}" id="draw">${st.drawn ? "Tout refaire (remet tous les boosters à zéro)" : "Lancer le tirage"}</button>
      <div class="msg" id="amsg">${esc(msg)}</div></div>
    <div class="panel"><h3>👥 Participants</h3>
      <form class="row" id="addf" style="margin-bottom:8px"><input type="text" id="newn" maxlength="30" placeholder="Prénom à ajouter" style="flex:1;min-width:160px"><button class="btn">Ajouter</button></form>
      ${P.map(p => `<div class="arow"><div><strong>${esc(p.name)}</strong><br><span>${p.claimed ? "🔒 code créé" : "😴 pas de code"} · ${p.wish ? "📝 indices" : "pas d'indices"}${st.drawn ? ` · ${p.opened ? "🎁 ouvert" : "booster fermé"}` : ""}</span></div>
        <div class="row"><button class="btn small" data-a="reset" data-n="${esc(p.name)}">Code oublié</button><button class="btn small" data-a="rm" data-n="${esc(p.name)}">Retirer</button></div></div>`).join("")}</div>`;
  const call = async (fn, args, okMsg) => { const r = await rpc(fn, { p_pass: S.admin, ...args }).catch(() => ({})); admin(r.ok ? okMsg : errText(r.error)); };
  const twice = (b, f) => { if (b.dataset.sure) return f(); b.dataset.sure = 1; const t = b.textContent; b.textContent = "Sûr ? Re-clique"; setTimeout(() => { delete b.dataset.sure; b.textContent = t; }, 3000); };
  $("#draw").onclick = e => st.drawn ? twice(e.target, () => call("ss_admin_draw", { p_force: true }, "Nouveau tirage effectué.")) : call("ss_admin_draw", { p_force: false }, "Tirage lancé ! Préviens l'équipe.");
  $("#addf").onsubmit = e => { e.preventDefault(); call("ss_admin_add", { p_name: $("#newn").value }, "Ajouté."); };
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => twice(b, () => b.dataset.a === "rm"
    ? call("ss_admin_remove", { p_name: b.dataset.n }, `${b.dataset.n} retiré·e.`)
    : call("ss_admin_reset_pin", { p_name: b.dataset.n }, `Code de ${b.dataset.n} effacé : il/elle peut en recréer un.`)));
}

/* ============================================================
   Démarrage
   ============================================================ */
async function route() {
  document.querySelectorAll(".veil").forEach(v => v.remove());
  if (location.hash === "#admin") return admin();
  const s = store.get();
  if (s && !S.name) {
    try { S.list = await rpc("ss_list"); const me = await rpc("ss_me", { p_name: s.n, p_pin: s.p }); if (me.ok) { S.name = s.n; S.pin = s.p; S.my = me; return mine(); } } catch (e) {}
    store.set(null);
  }
  if (S.name) return mine();
  home();
}
addEventListener("hashchange", route);
route();
